</head>
<body>
    <p class="class">Number 1 - I'm a class!</p>
    <div id = "ID">Number 2 - I'm one ID.</div>
    <p class = "class size24">Number 3 - I'm a class, but cooler!</p>
    <div id = "ID2" class = "size24">Number 4 - I'm another ID.</div>
    <p class = "class">Number 5 - I'm a class!</p>
    <div> Number 6 - I'm a new and old class</div>
    <p id = "orange">Number 7 - I'm a new class and ID! (hint: use google fonts)</p>
